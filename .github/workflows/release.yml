name: Release
on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type (major, minor, patch, prerelease)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
        default: patch
      prerelease_id:
        description: 'Prerelease identifier (e.g. beta, rc)'
        required: false
        default: beta
      dry_run:
        description: 'Run workflow in dry-run mode (no PR, no publish)'
        required: true
        default: 'false'
        type: boolean
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  release:
    types: [published]
permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  create-release-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'
      - name: Update npm to latest (required for Trusted Publishers)
        run: npm install -g npm@latest
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Configure Git
        run: |
          git config user.name "react-flipbook-bot"
          git config user.email "huynhdainhan242@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}
      - name: Install dependencies
        run: npm ci
      - name: Run linting
        run: npm run lint
        continue-on-error: true
      - name: Run type checking
        run: npm run typecheck
      - name: Run tests
        run: npm test
        continue-on-error: true
      - name: Build package
        run: npm run build
      - name: Get current version
        id: current_version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_OUTPUT
      - name: Bump version
        id: bump_version
        run: |
          VERSION_TYPE="${{ github.event.inputs.version_type }}"
          PRERELEASE_ID="${{ github.event.inputs.prerelease_id }}"
          if [[ "$VERSION_TYPE" == "prerelease" ]]; then
            npm version prerelease --preid "$PRERELEASE_ID" --no-git-tag-version
          else
            npm version "$VERSION_TYPE" --no-git-tag-version
          fi
          NEW_VERSION=$(node -p 'require("./package.json").version')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog for the new version
          awk '/^## /{p=0} /^## ${{ steps.bump_version.outputs.new_version }}/{p=1} p' CHANGELOG.md | head -n -1 > release_notes.md
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create release branch and commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: create_branch
        run: |
          BRANCH_NAME="release/${{ steps.bump_version.outputs.new_version }}"
          git checkout -b "$BRANCH_NAME"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.bump_version.outputs.new_version }}"
          git push origin "$BRANCH_NAME"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
      - name: Create Pull Request using GitHub CLI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: create_pr
        run: |
          # Create the PR using GitHub CLI with --body-file for proper multiline handling
          # First create a PR body file
          cat > pr_body.md << 'EOF'
          ## Release ${{ steps.bump_version.outputs.new_version }}

          This PR was automatically created by the release workflow.

          ### Changes
          - Version bump: `${{ steps.current_version.outputs.version }}` → `${{ steps.bump_version.outputs.new_version }}`
          - Updated CHANGELOG.md

          ### Release Notes
          EOF

          # Append release notes content
          cat release_notes.md >> pr_body.md

          cat >> pr_body.md << 'EOF'

          ---
          **After merging this PR:**
          1. A GitHub Release will be created automatically
          2. The package will be published to npm

          > ✅ Auto-merge is enabled. This PR will be merged automatically once all checks pass.
          EOF

          # Create the PR (without labels to avoid failure if they don't exist)
          PR_URL=$(gh pr create \
            --base main \
            --head "${{ steps.create_branch.outputs.branch_name }}" \
            --title "chore(release): ${{ steps.bump_version.outputs.new_version }}" \
            --body-file pr_body.md)

          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT
          echo "::notice::Pull Request created: ${PR_URL}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - name: Enable auto-merge for release PR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Enable auto-merge using squash merge strategy
          gh pr merge "${{ steps.create_pr.outputs.pr_url }}" --auto --squash
          echo "::notice::Auto-merge enabled for release PR"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
      - name: Publish to npm (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== DRY RUN MODE ==="
          echo "Would publish version: ${{ steps.bump_version.outputs.new_version }}"
          echo ""
          echo "=== Package contents ==="
          npm pack --dry-run
          echo ""
          echo "=== Changelog preview ==="
          head -50 CHANGELOG.md
  create-github-release:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
      - name: Verify merge commit is on main
        run: |
          git fetch origin main
          git branch --contains ${{ github.event.pull_request.merge_commit_sha }} | grep main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'
      - name: Get version from package.json
        id: get_version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_OUTPUT
      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Check if release already exists
        if: steps.check_tag.outputs.exists == 'true'
        id: check_release
        run: |
          RELEASE_EXISTS=$(gh release view "v${{ steps.get_version.outputs.version }}" --json name -q '.name' || echo "")
          if [[ -n "$RELEASE_EXISTS" ]]; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Exit if release already exists
        if: steps.check_tag.outputs.exists == 'true' && steps.check_release.outputs.release_exists == 'true'
        run: |
          echo "Release already exists for v${{ steps.get_version.outputs.version }}. Skipping."
          exit 0
      - name: Configure Git
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "react-flipbook-bot"
          git config user.email "huynhdainhan242@gmail.com"
      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          git tag -s "$TAG" -m "Release $TAG"
          git push origin "$TAG"
      - name: Generate release notes from CHANGELOG
        id: release_notes
        run: |
          awk '/^## /{p=0} /^## ${{ steps.get_version.outputs.version }}/{p=1} p' CHANGELOG.md | head -n -1 > release_notes.md
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Determine if prerelease
        if: steps.check_tag.outputs.exists == 'false' || steps.check_release.outputs.release_exists != 'true'
        id: prerelease
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false' || steps.check_release.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        if: steps.check_tag.outputs.exists == 'false' || steps.check_release.outputs.release_exists != 'true'
        run: |
          echo "Release v${{ steps.get_version.outputs.version }} created."
  publish-to-npm:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'
      - name: Update npm to latest (required for Trusted Publishers)
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Run linting
        run: npm run lint
        continue-on-error: true
      - name: Run type checking
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Check version matches tag
        run: |
          PKG_VERSION=$(node -p 'require("./package.json").version')
          TAG_VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "Version mismatch: package.json=$PKG_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --access public
      - name: Summary
        run: |
          echo "Published version: ${{ github.event.release.tag_name }}"
  deploy-storybook:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: publish-to-npm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Storybook
        run: npm run build-storybook
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
