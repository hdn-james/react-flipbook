name: Release

on:
  # Manual trigger for creating a release PR
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
        default: "patch"
      prerelease_id:
        description: "Prerelease identifier (e.g., alpha, beta, rc)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (do not publish)"
        required: false
        default: false
        type: boolean

  # Trigger when release PR is merged
  pull_request:
    types: [closed]
    branches:
      - main

  # Trigger on new releases (for npm publish)
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

# Use workflow name for concurrency to prevent overlapping runs across all trigger types
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # =============================================================================
  # Job 1: Create Release PR (manual trigger)
  # =============================================================================
  create-release-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Update npm to latest (required for Trusted Publishers)
        run: npm install -g npm@latest

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build package
        run: npm run build

      - name: Get current version
        id: current_version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        run: |
          if [ -n "${{ github.event.inputs.prerelease_id }}" ]; then
            NEW_VERSION=$(npm version ${{ github.event.inputs.version_type }} --preid=${{ github.event.inputs.prerelease_id }} --no-git-tag-version)
          else
            NEW_VERSION=$(npm version ${{ github.event.inputs.version_type }} --no-git-tag-version)
          fi
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"

          echo "Generating changelog from ${PREVIOUS_TAG:-beginning} to HEAD"

          # Create changelog entry
          CHANGELOG_FILE="CHANGELOG.md"
          TEMP_CHANGELOG=$(mktemp)
          DATE=$(date +%Y-%m-%d)

          # Generate commit log
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|feature|add)" || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bugfix|hotfix)" || true)
          DOCS=$(echo "$COMMITS" | grep -iE "^- (doc|docs)" || true)
          CHORES=$(echo "$COMMITS" | grep -iE "^- (chore|build|ci|refactor|style|test)" || true)
          OTHER=$(echo "$COMMITS" | grep -viE "^- (feat|feature|add|fix|bugfix|hotfix|doc|docs|chore|build|ci|refactor|style|test)" || true)

          # Build new changelog entry
          {
            echo "# Changelog"
            echo ""
            echo "## ${NEW_VERSION} (${DATE})"
            echo ""

            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo "$FEATURES"
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            if [ -n "$DOCS" ]; then
              echo "### 📚 Documentation"
              echo "$DOCS"
              echo ""
            fi

            if [ -n "$CHORES" ]; then
              echo "### 🔧 Maintenance"
              echo "$CHORES"
              echo ""
            fi

            if [ -n "$OTHER" ]; then
              echo "### 📦 Other Changes"
              echo "$OTHER"
              echo ""
            fi

            # Append existing changelog content (without the first "# Changelog" header)
            if [ -f "$CHANGELOG_FILE" ]; then
              tail -n +2 "$CHANGELOG_FILE"
            fi
          } > "$TEMP_CHANGELOG"

          mv "$TEMP_CHANGELOG" "$CHANGELOG_FILE"

          # Save release notes for GitHub release
          {
            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo "$FEATURES"
              echo ""
            fi

            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            if [ -n "$DOCS" ]; then
              echo "### 📚 Documentation"
              echo "$DOCS"
              echo ""
            fi

            if [ -n "$CHORES" ]; then
              echo "### 🔧 Maintenance"
              echo "$CHORES"
              echo ""
            fi

            if [ -n "$OTHER" ]; then
              echo "### 📦 Other Changes"
              echo "$OTHER"
              echo ""
            fi
          } > release_notes.md

          echo "Changelog generated successfully"

      - name: Create release branch and commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: create_branch
        run: |
          BRANCH_NAME="release/${{ steps.bump_version.outputs.new_version }}"
          git checkout -b "$BRANCH_NAME"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.bump_version.outputs.new_version }}"
          git push origin "$BRANCH_NAME"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Create Pull Request using GitHub CLI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: create_pr
        run: |
          # Create the PR using GitHub CLI with --body-file for proper multiline handling
          # First create a PR body file
          cat > pr_body.md << 'EOF'
          ## Release ${{ steps.bump_version.outputs.new_version }}

          This PR was automatically created by the release workflow.

          ### Changes
          - Version bump: `${{ steps.current_version.outputs.version }}` → `${{ steps.bump_version.outputs.new_version }}`
          - Updated CHANGELOG.md

          ### Release Notes
          EOF

          # Append release notes content
          cat release_notes.md >> pr_body.md

          cat >> pr_body.md << 'EOF'

          ---
          **After merging this PR:**
          1. A GitHub Release will be created automatically
          2. The package will be published to npm

          > ⚠️ Please review and merge this PR to complete the release.
          EOF

          # Create the PR (without labels to avoid failure if they don't exist)
          PR_URL=$(gh pr create \
            --base main \
            --head "${{ steps.create_branch.outputs.branch_name }}" \
            --title "chore(release): ${{ steps.bump_version.outputs.new_version }}" \
            --body-file pr_body.md)

          echo "pr_url=${PR_URL}" >> $GITHUB_OUTPUT
          echo "::notice::Pull Request created: ${PR_URL}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== DRY RUN MODE ==="
          echo "Would publish version: ${{ steps.bump_version.outputs.new_version }}"
          echo ""
          echo "=== Package contents ==="
          npm pack --dry-run
          echo ""
          echo "=== Changelog preview ==="
          head -50 CHANGELOG.md

      - name: Summary
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Previous version:** ${{ steps.current_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New version:** ${{ steps.bump_version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version bump:** ${{ github.event.inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run:** ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "### 📝 Pull Request Created" >> $GITHUB_STEP_SUMMARY
            echo "A pull request has been created for this release." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Review and merge the pull request" >> $GITHUB_STEP_SUMMARY
            echo "2. After merge, the publish workflow will automatically publish to npm" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # Job 2: Create GitHub Release (when release PR is merged)
  # Security: Only runs for PRs from the same repository, not forks
  # =============================================================================
  create-github-release:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify merge commit is on main
        run: |
          MERGE_COMMIT="${{ github.event.pull_request.merge_commit_sha }}"
          MAIN_REF="origin/main"

          # Ensure the main branch ref exists
          if ! git rev-parse --verify "$MAIN_REF" >/dev/null 2>&1; then
            echo "::error::Unable to find main branch ref ($MAIN_REF). Aborting release."
            exit 1
          fi

          # Verify the merge commit is an ancestor of main
          if ! git merge-base --is-ancestor "$MERGE_COMMIT" "$MAIN_REF"; then
            echo "::error::Merge commit $MERGE_COMMIT is not an ancestor of $MAIN_REF. Aborting tag creation."
            exit 1
          fi
      - name: Verify merge commit is on main
        run: |
          MERGE_COMMIT="${{ github.event.pull_request.merge_commit_sha }}"

          # Fetch main branch to ensure we have the latest
          git fetch origin main

          # Check if merge commit is reachable from main
          if ! git branch -r --contains "$MERGE_COMMIT" | grep -q "origin/main"; then
            echo "::error::Merge commit $MERGE_COMMIT is not on origin/main. Aborting tag creation."
            exit 1
          fi
          echo "✅ Verified: Merge commit is on main branch"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: v${VERSION}"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::Tag ${{ steps.get_version.outputs.version }} already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.version }} does not exist"
          fi

      - name: Check if release already exists
        if: steps.check_tag.outputs.exists == 'true'
        id: check_release
        run: |
          RELEASE_EXISTS=$(gh release view "${{ steps.get_version.outputs.version }}" --json tagName 2>/dev/null && echo "true" || echo "false")
          if [ "$RELEASE_EXISTS" == "true" ]; then
            echo "::warning::Release ${{ steps.get_version.outputs.version }} already exists. Exiting."
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Exit if release already exists
        if: steps.check_tag.outputs.exists == 'true' && steps.check_release.outputs.release_exists == 'true'
        run: |
          echo "Release already exists for tag ${{ steps.get_version.outputs.version }}. Nothing to do."
          exit 0

      - name: Configure Git
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.get_version.outputs.version }}"

          # Try to create the tag. If this fails because the tag was created
          # concurrently (e.g., by another workflow or a manual action),
          # handle it gracefully instead of failing the job.
          if git tag "$TAG"; then
            echo "Tag $TAG created locally."
            git push origin "$TAG"
          else
            echo "::warning::Failed to create tag $TAG. It may have been created concurrently. Fetching tags to verify."
            git fetch --tags
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG now exists after fetch. Assuming it was created elsewhere and continuing without pushing."
              exit 0
            else
              echo "::error::Failed to create or find tag $TAG after fetch."
              exit 1
            fi
          fi
      - name: Generate release notes from CHANGELOG
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          VERSION_NUMBER="${{ steps.get_version.outputs.version_number }}"

          # Extract release notes for this version from CHANGELOG.md
          # Match heading for this version while avoiding partial numeric matches
          NOTES=$(awk -v ver="$VERSION_NUMBER" '
            /^## / {
              if (found) exit
              # Match version with optional v prefix, avoiding partial matches
              if ($0 ~ ("^##[[:space:]]+v?" ver "([^0-9.]|$)")) found=1
            }
            found && !/^## / {print}
          ' CHANGELOG.md)

          # If no notes found, use a default message
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi

          # Save to file for the release action
          echo "$NOTES" > release_notes.md
          echo "Release notes generated"

      - name: Determine if prerelease
        id: prerelease
        run: |
          VERSION="${{ steps.get_version.outputs.version_number }}"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false' || steps.check_release.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🏷️ Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Prerelease:** ${{ steps.prerelease.outputs.is_prerelease || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "The publish job will now automatically publish this version to npm." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.version }})" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Job 3: Publish to npm (when GitHub release is published)
  # This job triggers on ANY published release. This is intentional to support
  # both workflow-created releases and manual releases.
  # =============================================================================
  publish-to-npm:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Update npm to latest (required for Trusted Publishers)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Run type checking
        run: npm run typecheck

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ github.event.release.tag_name }}"
          # Remove 'v' prefix if present
          TAG_VERSION="${TAG_VERSION#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Package version ($PACKAGE_VERSION) does not match release tag ($TAG_VERSION)"
            echo "Please update package.json version before creating a release."
            exit 1
          fi
          echo "✅ Version check passed: $PACKAGE_VERSION"

      # Trusted Publishers: No NPM_TOKEN needed!
      # OIDC token is automatically used for authentication
      # Provenance is automatically generated
      - name: Publish to npm
        run: npm publish --access public

      - name: Summary
        run: |
          echo "## 🎉 Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** react-3d-flipbook" >> $GITHUB_STEP_SUMMARY
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "- **Version:** ${PACKAGE_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 View on npm" >> $GITHUB_STEP_SUMMARY
          echo "[https://www.npmjs.com/package/react-3d-flipbook](https://www.npmjs.com/package/react-3d-flipbook)" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Job 4: Deploy Storybook to GitHub Pages (after npm publish)
  # =============================================================================
  deploy-storybook:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: publish-to-npm

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "storybook-static"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
