name: Create Release on Merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  create-release:
    # Only run if the PR was merged (not just closed) and is a release PR
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: v${VERSION}"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::Tag ${{ steps.get_version.outputs.version }} already exists. Skipping release creation."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get_version.outputs.version }} does not exist"
          fi

      - name: Check if release already exists
        if: steps.check_tag.outputs.exists == 'true'
        id: check_release
        run: |
          # Check if a GitHub release already exists for this tag
          RELEASE_EXISTS=$(gh release view "${{ steps.get_version.outputs.version }}" --json tagName 2>/dev/null && echo "true" || echo "false")
          if [ "$RELEASE_EXISTS" == "true" ]; then
            echo "::warning::Release ${{ steps.get_version.outputs.version }} already exists. Exiting."
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Exit if release already exists
        if: steps.check_tag.outputs.exists == 'true' && steps.check_release.outputs.release_exists == 'true'
        run: |
          echo "Release already exists for tag ${{ steps.get_version.outputs.version }}. Nothing to do."
          exit 0

      - name: Configure Git
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag ${{ steps.get_version.outputs.version }}
          git push origin ${{ steps.get_version.outputs.version }}

      - name: Generate release notes from CHANGELOG
        if: steps.check_release.outputs.release_exists != 'true'
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          VERSION_NUMBER="${{ steps.get_version.outputs.version_number }}"

          # Extract release notes for this version from CHANGELOG.md
          # Use word boundaries to match exact version number
          NOTES=$(awk -v ver="$VERSION_NUMBER" '
            /^## / {
              if (found) exit
              # Match exact version with word boundaries (space, parenthesis, or end of line)
              if ($0 ~ ("^## .*[^0-9]" ver "([^0-9]|$)") || $0 ~ ("^## " ver "([^0-9]|$)")) found=1
            }
            found && !/^## / {print}
          ' CHANGELOG.md)

          # If no notes found, use a default message
          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi

          # Save to file for the release action
          echo "$NOTES" > release_notes.md
          echo "Release notes generated"

      - name: Determine if prerelease
        if: steps.check_release.outputs.release_exists != 'true'
        id: prerelease
        run: |
          VERSION="${{ steps.get_version.outputs.version_number }}"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🏷️ Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Prerelease:** ${{ steps.prerelease.outputs.is_prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "The publish workflow will now automatically publish this version to npm." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
