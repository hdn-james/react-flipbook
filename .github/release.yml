# Configuration for auto-generated release notes
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - dependencies
      - skip-changelog
    authors:
      - dependabot
      - dependabot[bot]

  categories:
    - title: "🚀 New Features"
      labels:
        - feature
        - enhancement
        - feat

    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
        - bugfix
        - hotfix

    - title: "⚡ Performance Improvements"
      labels:
        - performance
        - perf
        - optimization

    - title: "📚 Documentation"
      labels:
        - documentation
        - docs

    - title: "🔧 Maintenance"
      labels:
        - chore
        - maintenance
        - refactor
        - cleanup

    - title: "🧪 Tests"
      labels:
        - test
        - tests
        - testing

    - title: "💥 Breaking Changes"
      labels:
        - breaking
        - breaking-change
        - major

    - title: "🔒 Security"
      labels:
        - security

    - title: "📦 Dependencies"
      labels:
        - dependencies
        - deps

    - title: "🎨 Styling"
      labels:
        - style
        - styling
        - ui

    - title: "Other Changes"
      labels:
        - "*"
